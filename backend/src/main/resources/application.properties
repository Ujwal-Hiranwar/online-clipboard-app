spring.config.import=optional:file:.env
spring.application.name=database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.password=${DB_PASSWORD}
# spring.devtools.restart.enabled=true
spring.main.allow-bean-definition-overriding=true
server.port=${PORT:8081}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:https://foryouclipboardapp.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-32-byte-minimum-value}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
jwt.refresh-ttl-days=${REFRESH_TOKEN_TTL_DAYS:14}
app.bootstrap-admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.cookie-secure=${APP_COOKIE_SECURE:true}
app.cookie-same-site=${APP_COOKIE_SAME_SITE:None}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
